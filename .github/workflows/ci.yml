name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nightdaro
          POSTGRES_PASSWORD: nightdaro
          POSTGRES_DB: nightdaro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nightdaro -d nightdaro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://nightdaro:nightdaro@localhost:5432/nightdaro
      # Test-only values for the seed and the e2e login; not real credentials.
      AUTH_SECRET: ci-only-auth-secret-not-used-anywhere-else
      AUTH_TRUST_HOST: "true"
      SEED_DARO_EMAIL: daro@example.com
      SEED_DARO_PASSWORD: ci-daro-password
      SEED_DAMI_EMAIL: dami@example.com
      SEED_DAMI_PASSWORD: ci-dami-password

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - run: pnpm db:migrate

      - run: pnpm db:seed

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
